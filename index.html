<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Work Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Concept: a wrapped gift-book. Closed: navy hardcover tied with a gold ribbon and bow.
   Click: ribbon slips off, cover swings open; inside cover = contents, right page = the day's colourful task list. */
:root {
  --desk-1: #f3e7d9; --desk-2: #e4d3c0;
  --cover: #1c3557; --cover-2: #284a76; --foil: #f0c96a; --ribbon: #e0a93a; --ribbon-dark: #b9831f;
  --paper: #fffaf1; --paper-edge: #efe4d2; --ink: #2a2433; --ink-soft: #776d80;
  --done: #23935a; --done-bg: #ddf5e7; --not: #d6455a; --not-bg: #fde3e7;
  --c1: #ff7a59; --c2: #ffb020; --c3: #2fbf71; --c4: #12a5c9; --c5: #6c63ff; --c6: #e64aa0; --c7: #00a896; --c8: #9e9d24;
  --f-cover: "DM Serif Display", Georgia, serif;
  --f-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: radial-gradient(circle at 30% 20%, var(--desk-1), var(--desk-2));
  color: var(--ink); font-family: var(--f-body); overflow-x: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;
  padding: 24px 16px 40px; gap: 18px;
}
button { font: inherit; }
:focus-visible { outline: 3px solid var(--c5); outline-offset: 3px; }

/* ---------- book ---------- */
.book {
  --pw: min(430px, 45vw); --ph: calc(var(--pw) * 1.36);
  position: relative; width: calc(var(--pw) * 2); height: var(--ph);
  perspective: 2400px;
  transform: translateX(calc(var(--pw) / -2));
  transition: transform 1s cubic-bezier(.6,.05,.25,1);
}
.book.open { transform: translateX(0); }

.page {
  position: absolute; top: 0; left: var(--pw); width: var(--pw); height: 100%;
  background: var(--paper); border-radius: 4px 14px 14px 4px;
  box-shadow: 0 24px 50px rgba(60, 40, 20, .25), inset 14px 0 18px -14px rgba(60, 40, 20, .25);
  overflow: hidden;
}
/* stacked page edges */
.page::after { content: ""; position: absolute; right: 0; top: 6px; bottom: 6px; width: 6px;
  background: repeating-linear-gradient(90deg, var(--paper-edge) 0 1px, var(--paper) 1px 2px); border-radius: 0 6px 6px 0; }

.cover {
  position: absolute; top: 0; left: var(--pw); width: var(--pw); height: 100%; z-index: 5;
  transform-origin: left center; transform-style: preserve-3d;
  transition: transform 1.3s cubic-bezier(.6,.05,.25,1);
}
.book.open .cover { transform: rotateY(-180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }

/* front of the cover */
.front {
  border-radius: 4px 14px 14px 4px; cursor: pointer; border: 0; padding: 0; width: 100%; text-align: center; color: var(--foil);
  background:
    radial-gradient(circle at 70% 25%, rgba(255,255,255,.12), transparent 55%),
    repeating-linear-gradient(45deg, rgba(255,255,255,.025) 0 2px, transparent 2px 6px),
    linear-gradient(135deg, var(--cover-2), var(--cover));
  box-shadow: 0 30px 60px rgba(30, 30, 60, .35), inset 10px 0 0 rgba(0,0,0,.18), inset 12px 0 0 rgba(255,255,255,.06);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  overflow: hidden;
}
.frame { position: absolute; inset: 22px 22px 22px 32px; border: 1.5px solid rgba(240, 201, 106, .55); border-radius: 6px; pointer-events: none; }
.frame::before { content: ""; position: absolute; inset: 6px; border: 1px solid rgba(240, 201, 106, .3); border-radius: 4px; }
.kicker { font-size: 12px; letter-spacing: .32em; text-transform: uppercase; font-weight: 700; opacity: .85; position: relative; z-index: 2; }
.cover h1 { font-family: var(--f-cover); font-weight: 400; font-size: clamp(34px, 5.2vw, 52px); line-height: 1.02; margin: 0; position: relative; z-index: 2; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
.cover .month { font-family: var(--f-cover); font-size: 18px; opacity: .9; position: relative; z-index: 2; }
.hint { position: absolute; bottom: 34px; left: 0; right: 0; font-size: 13px; font-weight: 700; letter-spacing: .08em; color: #fff; opacity: .9; z-index: 2; }
.hint span { display: inline-block; background: rgba(0,0,0,.25); padding: 6px 14px; border-radius: 999px; }

/* ribbon + bow */
.ribbon-v, .ribbon-h { position: absolute; background: linear-gradient(90deg, var(--ribbon-dark), var(--ribbon) 30%, #f6d58b 50%, var(--ribbon) 70%, var(--ribbon-dark)); z-index: 1; transition: transform .6s ease, opacity .6s ease; }
.ribbon-v { top: 0; bottom: 0; left: 80%; width: 30px; }
.ribbon-h { left: 0; right: 0; top: 17%; height: 30px; background: linear-gradient(180deg, var(--ribbon-dark), var(--ribbon) 30%, #f6d58b 50%, var(--ribbon) 70%, var(--ribbon-dark)); }
.bow { position: absolute; left: calc(80% + 15px); top: calc(17% + 15px); width: 130px; height: 92px; transform: translate(-50%, -50%); z-index: 3; transition: transform .6s cubic-bezier(.5,-0.4,.6,1), opacity .5s ease; filter: drop-shadow(0 6px 6px rgba(0,0,0,.3)); }
.tag { position: absolute; right: calc(20% + 4px); top: calc(17% + 48px); z-index: 2; background: var(--paper); color: var(--ink); font-size: 12px; font-weight: 800; padding: 6px 16px 6px 10px; border-radius: 8px 3px 3px 8px; transform: rotate(-8deg); transform-origin: right; box-shadow: 0 4px 8px rgba(0,0,0,.25); transition: opacity .4s; }
.tag::before { content: ""; position: absolute; right: 6px; top: 50%; width: 5px; height: 5px; margin-top: -2.5px; border-radius: 50%; background: var(--ribbon-dark); }
.book.unwrapping .ribbon-v { transform: translateY(-110%); opacity: 0; }
.book.unwrapping .ribbon-h { transform: translateX(110%); opacity: 0; }
.book.unwrapping .bow { transform: translate(-50%, -50%) scale(1.4) rotate(-25deg) translateY(-140px); opacity: 0; }
.book.unwrapping .tag { opacity: 0; }
@media (prefers-reduced-motion: no-preference) {
  .book:not(.open):not(.unwrapping) .bow { animation: wiggle 3.2s ease-in-out infinite; }
}
@keyframes wiggle { 0%, 86%, 100% { transform: translate(-50%, -50%) rotate(0); } 90% { transform: translate(-50%, -50%) rotate(-6deg); } 95% { transform: translate(-50%, -50%) rotate(5deg); } }

/* inside of the cover = left page */
.back {
  transform: rotateY(180deg); background: var(--paper); border-radius: 14px 4px 4px 14px;
  box-shadow: 0 24px 50px rgba(60, 40, 20, .22), inset -14px 0 18px -14px rgba(60, 40, 20, .25);
  padding: 34px 30px; display: flex; flex-direction: column; gap: 16px; overflow: auto;
}
.back h2 { font-family: var(--f-cover); font-weight: 400; font-size: 30px; margin: 0; color: var(--cover); }
.back p { margin: 0; color: var(--ink-soft); font-size: 14px; }
.toc { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.toc button { width: 100%; display: flex; align-items: center; gap: 10px; border: 0; background: transparent; padding: 8px 10px; border-radius: 10px; cursor: pointer; text-align: left; color: var(--ink); }
.toc button:hover, .toc button[aria-current="true"] { background: #f4ecdf; }
.toc .d { font-weight: 700; flex: 1; }
.toc .dots { display: flex; gap: 3px; }
.toc .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--not); }
.toc .dots i.y { background: var(--done); }
.links { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
.link { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 14px; border-radius: 12px; font-weight: 800; text-decoration: none; color: #fff; background: var(--cover); }
.link.alt { background: transparent; color: var(--cover); border: 2px solid var(--cover); }

/* ---------- the day's page ---------- */
.sheet { height: 100%; display: flex; flex-direction: column; padding: 40px 26px 18px; gap: 14px; transform-origin: left center; }
@media (prefers-reduced-motion: no-preference) {
  .sheet.out-next { animation: outNext .32s ease-in forwards; }
  .sheet.in-next  { animation: inNext .38s ease-out; }
  .sheet.out-prev { animation: outPrev .32s ease-in forwards; }
  .sheet.in-prev  { animation: inPrev .38s ease-out; }
}
@keyframes outNext { to { transform: perspective(1400px) rotateY(-75deg); opacity: 0; } }
@keyframes inNext  { from { transform: perspective(1400px) rotateY(35deg); opacity: 0; } }
@keyframes outPrev { to { transform: perspective(1400px) rotateY(35deg); opacity: 0; } }
@keyframes inPrev  { from { transform: perspective(1400px) rotateY(-75deg); opacity: 0; } }

.day-head { display: flex; align-items: center; gap: 14px; padding-bottom: 12px; border-bottom: 2px dashed var(--paper-edge); }
.day-head .when { flex: 1; min-width: 0; }
.weekday { font-size: 13px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; background: linear-gradient(90deg, var(--c1), var(--c6), var(--c5)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.date { font-family: var(--f-cover); font-size: clamp(24px, 3vw, 30px); line-height: 1.1; color: var(--ink); }
.ring { width: 64px; height: 64px; flex: none; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 15px; font-weight: 800; }

.tasks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; overflow: auto; flex: 1; min-height: 0; }
.task { --c: var(--c1); display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: color-mix(in srgb, var(--c) 11%, var(--paper)); border: 1.5px solid color-mix(in srgb, var(--c) 30%, transparent); }
.num { flex: none; width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; font-weight: 800; color: #fff; background: var(--c); box-shadow: 0 3px 0 color-mix(in srgb, var(--c) 60%, #000); }
.txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.txt .t { font-weight: 700; font-size: 14.5px; line-height: 1.25; }
.txt .n { font-size: 12.5px; color: var(--ink-soft); }
.stamp { flex: none; font-size: 12px; font-weight: 800; padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
.stamp.done { color: var(--done); background: var(--done-bg); }
.stamp.not { color: var(--not); background: var(--not-bg); }
.stamp.other { color: #8a5a00; background: #fff0cf; }
.empty { flex: 1; display: grid; place-items: center; text-align: center; color: var(--ink-soft); padding: 20px; }

.foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.nav { border: 0; background: var(--cover); color: #fff; font-weight: 800; padding: 8px 14px; border-radius: 10px; cursor: pointer; }
.nav:disabled { opacity: .3; cursor: default; }
.pg { font-size: 12px; color: var(--ink-soft); font-weight: 700; }
.close { position: absolute; top: 12px; right: 14px; z-index: 2; border: 0; background: transparent; color: var(--ink-soft); font-size: 13px; font-weight: 700; cursor: pointer; padding: 4px 8px; border-radius: 8px; }
.close:hover { background: #f4ecdf; }

.below { font-size: 13px; color: #6b5a48; text-align: center; }
.below a { color: var(--cover); font-weight: 700; }

/* ---------- phone: single page ---------- */
@media (max-width: 760px) {
  .book { --pw: min(92vw, 420px); --ph: max(560px, calc(var(--pw) * 1.45)); width: var(--pw); transform: none; }
  .book.open { transform: none; }
  .page, .cover { left: 0; }
  .book.open .cover { transform: rotateY(-180deg) translateX(-10px); }
  .cover.gone { visibility: hidden; }
  .sheet { padding: 40px 16px 16px; }
  .tag { display: none; }
  .stamp { padding: 5px 8px; font-size: 11px; }
}
@media (prefers-reduced-motion: reduce) {
  .book, .cover, .ribbon-v, .ribbon-h, .bow { transition-duration: .01s !important; }
}
</style>
</head>
<body>

<div class="book" id="book">
  <section class="page" aria-live="polite">
    <button class="close" id="close" type="button">Close book</button>
    <div class="sheet" id="sheet"></div>
  </section>

  <div class="cover" id="cover">
    <button class="face front" id="front" type="button" aria-label="Open the book">
      <span class="ribbon-v" aria-hidden="true"></span>
      <span class="ribbon-h" aria-hidden="true"></span>
      <svg class="bow" viewBox="0 0 130 92" aria-hidden="true">
        <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#b9831f"/><stop offset=".5" stop-color="#f6d58b"/><stop offset="1" stop-color="#e0a93a"/></linearGradient></defs>
        <path d="M65 46 C40 8, 4 10, 8 38 C11 60, 44 56, 65 46 Z" fill="url(#g)" stroke="#9c6c14" stroke-width="1.5"/>
        <path d="M65 46 C90 8, 126 10, 122 38 C119 60, 86 56, 65 46 Z" fill="url(#g)" stroke="#9c6c14" stroke-width="1.5"/>
        <path d="M58 50 L40 90 L52 84 L58 92 L64 54 Z" fill="#e0a93a" stroke="#9c6c14" stroke-width="1.2"/>
        <path d="M72 50 L90 90 L78 84 L72 92 L66 54 Z" fill="#e0a93a" stroke="#9c6c14" stroke-width="1.2"/>
        <path d="M30 32 C40 30, 52 38, 60 44" fill="none" stroke="#9c6c14" stroke-width="1.2" opacity=".6"/>
        <path d="M100 32 C90 30, 78 38, 70 44" fill="none" stroke="#9c6c14" stroke-width="1.2" opacity=".6"/>
        <ellipse cx="65" cy="47" rx="11" ry="10" fill="#f0c96a" stroke="#9c6c14" stroke-width="1.5"/>
      </svg>
      <span class="tag" aria-hidden="true">Daily report</span>
      <span class="frame" aria-hidden="true"></span>
      <span class="kicker">Work Journal</span>
      <h1>Daily<br>Work Log</h1>
      <span class="month" id="cover-month"></span>
      <span class="hint"><span>Tap to open</span></span>
    </button>
    <div class="face back" id="back">
      <h2>Contents</h2>
      <p>Pick a day to see its tasks.</p>
      <ul class="toc" id="toc"></ul>
      <div class="links">
        <a class="link" href="dashboard.html">Full dashboard</a>
        <a class="link alt" href="dashboard.html">Download PDF / Excel report</a>
      </div>
    </div>
  </div>
</div>

<p class="below">Updated daily · <a href="dashboard.html">Open the dashboard</a></p>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const book = $("book"), cover = $("cover");
  const COLORS = ["--c1", "--c2", "--c3", "--c4", "--c5", "--c6", "--c7", "--c8"];
  const LABEL = { done: "Done ✓", not_done: "Not done ✗", in_progress: "In progress", pending: "Pending", blocked: "Blocked" };
  let days = [], idx = 0;   // days oldest → newest; idx = current page

  const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const fmt = (s, o) => parse(s).toLocaleDateString("en-GB", o);
  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  const phone = () => window.matchMedia("(max-width: 760px)").matches;
  const reduce = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* open / close */
  function openBook() {
    if (book.classList.contains("open")) return;
    book.classList.add("unwrapping");
    setTimeout(() => {
      book.classList.add("open");
      if (phone()) setTimeout(() => cover.classList.add("gone"), reduce() ? 0 : 1300);
      $("close").focus({ preventScroll: true });
    }, reduce() ? 0 : 550);
  }
  function closeBook() {
    cover.classList.remove("gone");
    book.classList.remove("open");
    setTimeout(() => { book.classList.remove("unwrapping"); $("front").focus({ preventScroll: true }); }, reduce() ? 0 : 1100);
  }
  $("front").addEventListener("click", openBook);
  $("close").addEventListener("click", closeBook);

  /* pages */
  function ring(done, total) {
    const r = 26, C = 2 * Math.PI * r, p = total ? done / total : 0;
    const wrap = el("div", "ring");
    wrap.innerHTML = '<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="26" fill="none" stroke="#efe4d2" stroke-width="7"/>' +
      '<circle cx="32" cy="32" r="26" fill="none" stroke="' + (p === 1 ? "#23935a" : p >= .5 ? "#ffb020" : "#d6455a") + '" stroke-width="7" stroke-linecap="round" stroke-dasharray="' + (C * p) + " " + C + '"/></svg>';
    wrap.append(el("b", null, done + "/" + total));
    wrap.setAttribute("aria-label", done + " of " + total + " tasks done");
    return wrap;
  }
  function renderPage() {
    const sheet = $("sheet"); sheet.replaceChildren();
    if (!days.length) {
      sheet.append(el("div", "empty", "No days logged yet. The first page will appear here soon."));
      return;
    }
    const day = days[idx], tasks = day.tasks || [];
    const done = tasks.filter((t) => t.status === "done").length;
    const head = el("div", "day-head"), when = el("div", "when");
    when.append(el("div", "weekday", fmt(day.date, { weekday: "long" })), el("div", "date", fmt(day.date, { day: "numeric", month: "long", year: "numeric" })));
    head.append(when, ring(done, tasks.length));
    sheet.append(head);

    if (!tasks.length) sheet.append(el("div", "empty", "No tasks written on this page."));
    else {
      const ul = el("ul", "tasks");
      tasks.forEach((t, i) => {
        const li = el("li", "task"); li.style.setProperty("--c", "var(" + COLORS[i % COLORS.length] + ")");
        const txt = el("div", "txt"); txt.append(el("span", "t", t.task));
        if (t.notes) txt.append(el("span", "n", t.notes));
        const cls = t.status === "done" ? "done" : (t.status === "not_done" || t.status === "blocked") ? "not" : "other";
        li.append(el("span", "num", String(i + 1)), txt, el("span", "stamp " + cls, LABEL[t.status] || t.status));
        ul.append(li);
      });
      sheet.append(ul);
    }
    const foot = el("div", "foot");
    const prev = el("button", "nav", "‹ Previous day"); prev.type = "button"; prev.disabled = idx === 0;
    const next = el("button", "nav", "Next day ›"); next.type = "button"; next.disabled = idx === days.length - 1;
    prev.addEventListener("click", () => turn(idx - 1, "prev"));
    next.addEventListener("click", () => turn(idx + 1, "next"));
    foot.append(prev, el("span", "pg", "Page " + (idx + 1) + " of " + days.length), next);
    sheet.append(foot);
    renderToc();
  }
  function turn(to, dir) {
    if (to < 0 || to >= days.length || to === idx) return;
    const sheet = $("sheet");
    if (reduce()) { idx = to; renderPage(); return; }
    sheet.className = "sheet out-" + dir;
    setTimeout(() => {
      idx = to; renderPage();
      sheet.className = "sheet in-" + dir;
      setTimeout(() => { sheet.className = "sheet"; }, 400);
    }, 320);
  }
  function renderToc() {
    const toc = $("toc"); toc.replaceChildren();
    days.map((d, i) => ({ d, i })).reverse().forEach(({ d, i }) => {
      const li = el("li"), b = el("button"); b.type = "button";
      b.setAttribute("aria-current", String(i === idx));
      b.append(el("span", "d", fmt(d.date, { weekday: "short", day: "numeric", month: "short" })));
      const dots = el("span", "dots");
      (d.tasks || []).forEach((t) => dots.append(el("i", t.status === "done" ? "y" : "")));
      b.append(dots);
      b.addEventListener("click", () => turn(i, i > idx ? "next" : "prev"));
      li.append(b); toc.append(li);
    });
  }

  document.addEventListener("keydown", (e) => {
    if (!book.classList.contains("open")) return;
    if (e.key === "ArrowRight") turn(idx + 1, "next");
    if (e.key === "ArrowLeft") turn(idx - 1, "prev");
    if (e.key === "Escape") closeBook();
  });

  fetch("data/tasks.json?v=" + Date.now(), { cache: "no-store" })
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then((data) => {
      days = (data.days || []).filter((d) => d && d.date).sort((a, b) => a.date.localeCompare(b.date));
      idx = Math.max(0, days.length - 1);
      const last = days.length ? days[days.length - 1].date : null;
      $("cover-month").textContent = last ? fmt(last, { month: "long", year: "numeric" }) : "";
      renderPage();
      if (location.hash === "#open") { book.classList.add("unwrapping", "open"); if (phone()) cover.classList.add("gone"); }
    })
    .catch(() => { $("sheet").replaceChildren(el("div", "empty", "Couldn't load the tasks. Reload the page to try again.")); });
})();
</script>
</body>
</html>
