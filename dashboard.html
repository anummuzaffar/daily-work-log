<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Work Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Concept: the book's colourful inside pages, opened up as a dashboard. Warm desk background,
   navy + gold hero (same as the book cover), then bright tinted cards — one colour per task, everywhere. */
:root {
  --desk-1: #f7efe5; --desk-2: #eee0cf;
  --surface: #fffdf9; --fg: #2a2433; --muted: #776d80; --line: #eadfce; --rule: #f1e8db;
  --cover: #1c3557; --cover-2: #284a76; --foil: #f0c96a;
  --accent: #6c63ff; --accent-soft: #ecebff;
  --done: #23935a; --done-bg: #ddf5e7; --prog: #e08a00; --prog-bg: #fff0cf;
  --pend: #7b8a96; --pend-bg: #e9edf0; --block: #d6455a; --block-bg: #fde3e7;
  --c1: #ff7a59; --c2: #ffb020; --c3: #2fbf71; --c4: #12a5c9; --c5: #6c63ff; --c6: #e64aa0;
  --f-display: "DM Serif Display", Georgia, serif;
  --f-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: radial-gradient(circle at 20% 0%, var(--desk-1), var(--desk-2)) fixed; color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.55; padding: 24px 16px 64px; min-height: 100vh; }
.wrap { max-width: 1140px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
input, select, button { font: inherit; color: var(--fg); }
:focus-visible { outline: 3px solid var(--c5); outline-offset: 2px; }

/* hero = the book cover */
header {
  position: relative; overflow: hidden; border-radius: 18px; padding: 26px 28px;
  background: radial-gradient(circle at 85% 0%, rgba(255,255,255,.14), transparent 50%), linear-gradient(135deg, var(--cover-2), var(--cover));
  color: #fff; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px 24px;
  box-shadow: 0 18px 40px rgba(28, 53, 87, .25);
}
header { padding-right: 76px; }
header::before { content: ""; position: absolute; top: 0; bottom: 0; right: 30px; width: 22px; background: linear-gradient(90deg, #b9831f, #e0a93a 30%, #f6d58b 50%, #e0a93a 70%, #b9831f); opacity: .9; }
header > * { position: relative; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(30px, 5vw, 44px); line-height: 1.05; margin: 0; color: var(--foil); }
.sub { color: rgba(255,255,255,.8); margin: 4px 0 0; }
header a { display: inline-block; background: var(--foil); color: var(--cover) !important; padding: 8px 16px; border-radius: 999px; font-weight: 800; text-decoration: none; box-shadow: 0 3px 0 #b9831f; }
.updated { font-family: var(--f-mono); font-size: 12px; color: rgba(255,255,255,.75); }
.rainbow { height: 6px; border-radius: 999px; background: linear-gradient(90deg, var(--c1), var(--c2), var(--c3), var(--c4), var(--c5), var(--c6)); }

h2 { font-family: var(--f-display); font-weight: 400; font-size: 22px; margin: 0; color: var(--cover); display: flex; align-items: center; gap: 10px; }
h2::before { content: ""; width: 12px; height: 12px; border-radius: 4px; background: var(--h, var(--c5)); transform: rotate(45deg); }

.field { padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; min-width: 0; }
.bar { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: end; box-shadow: 0 8px 20px rgba(80, 50, 20, .06); }
.bar .grp { display: flex; flex-direction: column; gap: 4px; }
.bar label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 800; }
.bar .grow { flex: 1 1 200px; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 13px; font-weight: 700; padding: 7px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: #fff; cursor: pointer; }
.chip:hover { border-color: var(--c5); }
.chip[aria-pressed="true"] { background: linear-gradient(135deg, var(--c5), var(--c6)); border-color: transparent; color: #fff; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 12px; border: 0; color: #fff; font-weight: 800; cursor: pointer; white-space: nowrap; background: linear-gradient(135deg, #2fbf71, #1d8f54); box-shadow: 0 4px 0 #17703f; }
.btn.pdf { background: linear-gradient(135deg, #ff7a59, #d6455a); box-shadow: 0 4px 0 #a8303f; }
.btn:active { transform: translateY(2px); box-shadow: none; }
.btn svg { width: 16px; height: 16px; }

/* KPI cards: each its own colour */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.kpi { --c: var(--c4); position: relative; overflow: hidden; border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 2px;
  background: linear-gradient(160deg, color-mix(in srgb, var(--c) 18%, #fff), color-mix(in srgb, var(--c) 6%, #fff)); border: 1.5px solid color-mix(in srgb, var(--c) 30%, transparent); }
.kpi::after { content: ""; position: absolute; right: -18px; top: -18px; width: 70px; height: 70px; border-radius: 50%; background: color-mix(in srgb, var(--c) 22%, transparent); }
.kpi b { font-family: var(--f-display); font-weight: 400; font-size: 38px; line-height: 1.05; color: var(--c); font-variant-numeric: tabular-nums; }
.kpi span { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: color-mix(in srgb, var(--c) 70%, #333); font-weight: 800; }
.kpi small { color: var(--muted); font-size: 12px; font-weight: 700; }
.kpi.done { --c: var(--c3); } .kpi.block { --c: #e2475c; } .kpi.prog { --c: var(--c2); } .kpi.rate { --c: var(--c5); }
.kpi.pendk { --c: #7b8a96; }

.panel { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 18px; min-width: 0; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 8px 20px rgba(80, 50, 20, .06); }
.charts { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; }
.charts .panel:first-child h2 { --h: var(--c3); } .charts .panel:last-child h2 { --h: var(--c1); }
#checklist-panel h2 { --h: var(--c4); }
.chart-box { position: relative; height: 260px; }
@media (max-width: 820px) { .charts { grid-template-columns: 1fr; } }

.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; }
th { text-align: left; font-weight: 800; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding: 8px 14px 8px; }
td { padding: 9px 14px; border-top: 1.5px solid var(--rule); vertical-align: middle; }
.badge { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 10px; color: #fff; font-weight: 800; font-size: 14px; background: var(--c); box-shadow: 0 3px 0 color-mix(in srgb, var(--c) 60%, #000); flex: none; }
.rtcell { display: flex; align-items: center; gap: 10px; }

/* checklist grid */
.grid th, .grid td { text-align: center; white-space: nowrap; padding: 8px 10px; }
.grid th.rt, .grid td.rt { text-align: left; position: sticky; left: 0; background: var(--surface); min-width: 240px; white-space: normal; z-index: 1; }
.grid td.rt { font-weight: 700; }
.grid tbody tr:hover td { background: #fbf6ee; }
.grid th .wd { display: block; font-weight: 700; text-transform: none; letter-spacing: 0; }
.mark { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 9px; font-weight: 800; font-size: 14px; }
.mark.y { color: #fff; background: var(--c3); box-shadow: 0 3px 0 #1d8f54; }
.mark.n { color: #fff; background: #e2475c; box-shadow: 0 3px 0 #a8303f; }
.mark.o { color: #fff; background: var(--c2); box-shadow: 0 3px 0 #b97a00; }
.mark.e { color: var(--muted); }
.grid td.sum { font-weight: 800; color: var(--cover); font-variant-numeric: tabular-nums; }

/* day cards: each task line tinted with its colour, like the book */
.days { display: flex; flex-direction: column; gap: 16px; }
.day { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: 0 8px 20px rgba(80, 50, 20, .06); }
.day-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 16px; padding: 14px 18px; background: linear-gradient(90deg, color-mix(in srgb, var(--c5) 14%, #fff), color-mix(in srgb, var(--c6) 10%, #fff)); }
.day-head h3 { font-family: var(--f-display); font-weight: 400; font-size: 21px; margin: 0; color: var(--cover); }
.iso { font-family: var(--f-mono); font-size: 12px; color: var(--muted); margin-left: 8px; }
.tally { font-size: 13px; font-weight: 800; color: #fff; background: var(--cover); padding: 4px 12px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.day.today .day-head { background: linear-gradient(90deg, color-mix(in srgb, var(--c2) 28%, #fff), color-mix(in srgb, var(--c1) 18%, #fff)); }
.tag { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #fff; background: var(--c1); padding: 2px 8px; border-radius: 999px; font-weight: 800; margin-left: 8px; font-family: var(--f-body); vertical-align: middle; }
.day tbody tr { background: color-mix(in srgb, var(--c) 7%, #fff); }
.day td.n { width: 1%; }
.day td.proj { color: var(--muted); font-weight: 700; }
.day td.notes { color: var(--muted); }
.task { font-weight: 700; }
.pill { display: inline-block; white-space: nowrap; font-size: 12px; font-weight: 800; padding: 4px 12px; border-radius: 999px; }
.pill.done { color: #fff; background: var(--c3); } .pill.not_done, .pill.blocked { color: #fff; background: #e2475c; }
.pill.in_progress { color: #fff; background: var(--c2); } .pill.pending { color: #fff; background: #7b8a96; }
.state { background: var(--surface); border: 2px dashed var(--line); border-radius: 16px; padding: 28px; text-align: center; color: var(--muted); font-weight: 700; }
@media (max-width: 560px) { th.proj, td.proj { display: none; } td, th { padding-left: 10px; padding-right: 10px; } header { padding: 22px 60px 22px 18px; } header::before { right: 20px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="title">Daily Work Log</h1>
      <p class="sub">Tasks, status and progress, updated daily.</p>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
      <a href="./" style="color:var(--accent);font-weight:600;text-decoration:none">📖 Open book view</a>
      <span class="updated" id="updated"></span>
    </div>
  </header>
  <div class="rainbow" aria-hidden="true"></div>

  <section class="bar" aria-label="Report period and filters">
    <div class="grp">
      <label>Period</label>
      <div class="presets" role="group" aria-label="Period">
        <button class="chip" data-p="today" type="button" aria-pressed="false">Today</button>
        <button class="chip" data-p="week" type="button" aria-pressed="true">This week</button>
        <button class="chip" data-p="month" type="button" aria-pressed="false">This month</button>
        <button class="chip" data-p="all" type="button" aria-pressed="false">All</button>
      </div>
    </div>
    <div class="grp"><label for="from">From</label><input class="field" type="date" id="from"></div>
    <div class="grp"><label for="to">To</label><input class="field" type="date" id="to"></div>
    <div class="grp"><label for="status">Status</label>
      <select class="field" id="status"><option value="all">All</option><option value="done">Done</option><option value="not_done">Not done</option><option value="in_progress">In progress</option><option value="pending">Pending</option><option value="blocked">Blocked</option></select></div>
    <div class="grp"><label for="project">Project</label><select class="field" id="project"><option value="all">All</option></select></div>
    <div class="grp grow"><label for="q">Search</label><input class="field" type="search" id="q" placeholder="Task, project or note"></div>
    <button class="btn" id="xlsx" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
      Download Excel report
    </button>
    <button class="btn pdf" id="pdf" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
      Download PDF report
    </button>
  </section>

  <section class="kpis" aria-label="Summary">
    <div class="kpi"><span>Tasks</span><b id="k-total">–</b><small id="k-days"></small></div>
    <div class="kpi done"><span>Done</span><b id="k-done">–</b></div>
    <div class="kpi block"><span>Not done</span><b id="k-not">–</b></div>
    <div class="kpi prog" id="kw-prog" hidden><span>In progress</span><b id="k-prog">–</b></div>
    <div class="kpi pendk" id="kw-pend" hidden><span>Pending</span><b id="k-pend">–</b></div>
    <div class="kpi block" id="kw-block" hidden><span>Blocked</span><b id="k-block">–</b></div>
    <div class="kpi rate"><span>Completion</span><b id="k-rate">–</b></div>
  </section>

  <section class="panel" id="checklist-panel" hidden>
    <h2>Daily checklist</h2>
    <div class="scroll"><table class="grid" id="checklist"></table></div>
  </section>

  <section class="charts">
    <div class="panel"><h2>Tasks per day</h2><div class="chart-box"><canvas id="c-days" aria-label="Tasks per day by status" role="img"></canvas></div></div>
    <div class="panel"><h2>By project</h2><div class="chart-box"><canvas id="c-proj" aria-label="Tasks by project" role="img"></canvas></div></div>
  </section>

  <section class="days" id="days"><div class="state">Loading…</div></section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
(function () {
  const LABEL = { done: "Done", not_done: "Not done", in_progress: "In progress", pending: "Pending", blocked: "Blocked" };
  const ORDER = ["done", "not_done", "in_progress", "pending", "blocked"];
  const $ = (id) => document.getElementById(id);
  const PAL = ["#ff7a59", "#ffb020", "#2fbf71", "#12a5c9", "#6c63ff", "#e64aa0", "#00a896", "#9e9d24"];
  let DATA = { days: [] }, rows = [], charts = {};

  const iso = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const nice = (s) => parse(s).toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  const short = (s) => parse(s).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
  const weekday = (s) => parse(s).toLocaleDateString("en-GB", { weekday: "long" });
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  function setPreset(p) {
    const now = new Date(); let from, to = iso(now);
    if (p === "today") from = to;
    else if (p === "week") { const d = new Date(now); const off = (d.getDay() + 6) % 7; d.setDate(d.getDate() - off); from = iso(d); }
    else if (p === "month") from = iso(new Date(now.getFullYear(), now.getMonth(), 1));
    else { const ds = DATA.days.map((d) => d.date).sort(); from = ds[0] || to; to = ds[ds.length - 1] > to ? ds[ds.length - 1] : to; }
    $("from").value = from; $("to").value = to;
    document.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", String(c.dataset.p === p)));
    update();
  }

  function filtered() {
    const from = $("from").value || "0000", to = $("to").value || "9999";
    const st = $("status").value, pj = $("project").value, q = $("q").value.trim().toLowerCase();
    return rows.filter((r) => r.date >= from && r.date <= to &&
      (st === "all" || r.status === st) && (pj === "all" || r.project === pj) &&
      (!q || [r.task, r.project, r.notes].join(" ").toLowerCase().includes(q)));
  }

  function update() {
    const list = filtered();
    const c = (s) => list.filter((r) => r.status === s).length;
    const dates = [...new Set(list.map((r) => r.date))].sort();
    $("k-total").textContent = list.length;
    $("k-days").textContent = dates.length + (dates.length === 1 ? " day" : " days");
    $("k-done").textContent = c("done"); $("k-not").textContent = c("not_done"); $("k-prog").textContent = c("in_progress");
    $("k-pend").textContent = c("pending"); $("k-block").textContent = c("blocked");
    $("kw-prog").hidden = !c("in_progress"); $("kw-pend").hidden = !c("pending"); $("kw-block").hidden = !c("blocked");
    $("k-rate").textContent = list.length ? Math.round((c("done") / list.length) * 100) + "%" : "–";
    drawChecklist();
    drawCharts(list, dates);
    drawDays(list);
  }

  // Checklist grid: routine tasks (rows) x days in period (columns)
  function checklistData() {
    const routine = DATA.routine || [];
    const from = $("from").value || "0000", to = $("to").value || "9999";
    const dates = [...new Set(rows.filter((r) => r.date >= from && r.date <= to).map((r) => r.date))].sort();
    const cell = (rt, d) => rows.find((r) => r.date === d && (r.rid === rt.id || r.task === rt.task));
    return { routine, dates, cell };
  }
  function drawChecklist() {
    const { routine, dates, cell } = checklistData();
    $("checklist-panel").hidden = !routine.length;
    const t = $("checklist"); t.replaceChildren();
    if (!routine.length) return;
    if (!dates.length) { const tr = el("tr"); tr.append(el("td", "rt", "No days logged in this period yet.")); t.append(tr); return; }
    const thead = el("thead"), hr = el("tr");
    hr.append(el("th", "rt", "Task"));
    dates.forEach((d) => { const th = el("th", null, short(d)); th.append(el("span", "wd", parse(d).toLocaleDateString("en-GB", { weekday: "short" }))); hr.append(th); });
    hr.append(el("th", null, "Done"));
    thead.append(hr); t.append(thead);
    const tb = el("tbody");
    routine.forEach((rt) => {
      const tr = el("tr"); const rtd = el("td", "rt"); const rc = el("div", "rtcell");
      const bdg = el("span", "badge", String(rt.id)); bdg.style.setProperty("--c", PAL[(rt.id - 1) % PAL.length]);
      rc.append(bdg, el("span", null, rt.task)); rtd.append(rc); tr.append(rtd);
      let done = 0, logged = 0;
      dates.forEach((d) => {
        const r = cell(rt, d); const td = el("td");
        let cls = "e", sym = "–", tip = "Not logged";
        if (r) { logged++; tip = LABEL[r.status] + (r.notes ? ": " + r.notes : "");
          if (r.status === "done") { cls = "y"; sym = "✓"; done++; } else if (r.status === "not_done" || r.status === "blocked") { cls = "n"; sym = "✗"; } else { cls = "o"; sym = "•"; } }
        const m = el("span", "mark " + cls, sym); m.title = tip; m.setAttribute("aria-label", tip); td.append(m); tr.append(td);
      });
      tr.append(el("td", "sum", done + "/" + logged));
      tb.append(tr);
    });
    t.append(tb);
  }

  function drawCharts(list, dates) {
    if (!window.Chart) return;
    const color = { done: css("--done"), not_done: css("--block"), in_progress: css("--prog"), pending: css("--pend"), blocked: css("--block") };
    const grid = css("--line"), text = css("--muted");
    Chart.defaults.color = text; Chart.defaults.font.family = css("--f-body");
    const ds = ORDER.filter((s) => list.some((r) => r.status === s)).map((s) => ({ label: LABEL[s], backgroundColor: color[s], borderRadius: 3, data: dates.map((d) => list.filter((r) => r.date === d && r.status === s).length) }));
    charts.days && charts.days.destroy();
    charts.days = new Chart($("c-days"), { type: "bar", data: { labels: dates.map(short), datasets: ds },
      options: { maintainAspectRatio: false, plugins: { legend: { position: "bottom", labels: { boxWidth: 10, boxHeight: 10 } } },
        scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, beginAtZero: true, ticks: { precision: 0 }, grid: { color: grid } } } } });
    const projects = {};
    list.forEach((r) => { const p = r.project || "Other"; projects[p] = (projects[p] || 0) + 1; });
    const ents = Object.entries(projects).sort((a, b) => b[1] - a[1]);
    charts.proj && charts.proj.destroy();
    charts.proj = new Chart($("c-proj"), { type: "bar", data: { labels: ents.map((e) => e[0]), datasets: [{ label: "Tasks", data: ents.map((e) => e[1]), backgroundColor: ents.map((e, i) => PAL[i % PAL.length]), borderRadius: 6 }] },
      options: { indexAxis: "y", maintainAspectRatio: false, plugins: { legend: { display: false } },
        scales: { x: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: grid } }, y: { grid: { display: false } } } } });
  }

  function drawDays(list) {
    const box = $("days"); box.replaceChildren();
    if (!list.length) { box.append(el("div", "state", "No tasks in this period. Change the dates or filters above.")); return; }
    const today = iso(new Date());
    const dates = [...new Set(list.map((r) => r.date))].sort().reverse();
    for (const d of dates) {
      const items = list.filter((r) => r.date === d);
      const card = el("article", "day" + (d === today ? " today" : ""));
      const head = el("div", "day-head"); const h = el("h3", null, nice(d));
      h.append(el("span", "iso", d)); if (d === today) h.append(el("span", "tag", "Today"));
      head.append(h, el("span", "tally", items.filter((r) => r.status === "done").length + " of " + items.length + " done"));
      const sc = el("div", "scroll"); const t = el("table"); const th = el("tr");
      [["#", ""], ["Task", ""], ["Project", "proj"], ["Status", ""], ["Notes", ""]].forEach(([l, c]) => th.append(el("th", c, l)));
      const thead = el("thead"); thead.append(th); t.append(thead);
      const tb = el("tbody");
      items.forEach((r, i) => {
        const tr = el("tr"); const col = PAL[(r.rid ? r.rid - 1 : i) % PAL.length]; tr.style.setProperty("--c", col);
        const nd = el("td", "n"); nd.append(el("span", "badge", String(i + 1))); tr.append(nd);
        const a = el("td"); a.append(el("span", "task", r.task)); tr.append(a);
        tr.append(el("td", "proj", r.project || "—"));
        const s = el("td"); s.append(el("span", "pill " + r.status, LABEL[r.status] || r.status)); tr.append(s);
        tr.append(el("td", "notes", r.notes || ""));
        tb.append(tr);
      });
      t.append(tb); sc.append(t); card.append(head, sc); box.append(card);
    }
  }

  function downloadExcel() {
    if (!window.XLSX) { alert("The Excel library didn't load. Check your connection and reload."); return; }
    const list = filtered().slice().sort((a, b) => a.date.localeCompare(b.date));
    const from = $("from").value, to = $("to").value;
    const c = (s) => list.filter((r) => r.status === s).length;
    const wb = XLSX.utils.book_new();

    const summary = [
      [DATA.title || "Daily Work Log", ""],
      ["Report period", from === to ? from : from + " to " + to],
      ["Generated", new Date().toLocaleString("en-GB")],
      [],
      ["Status", "Tasks"],
      ...ORDER.map((s) => [LABEL[s], c(s)]),
      ["Total", list.length],
      ["Completion", list.length ? Math.round((c("done") / list.length) * 100) + "%" : "-"],
      [],
      ["Project", "Tasks", "Done"],
    ];
    const pj = {};
    list.forEach((r) => { const p = r.project || "Other"; pj[p] = pj[p] || [0, 0]; pj[p][0]++; if (r.status === "done") pj[p][1]++; });
    Object.entries(pj).sort((a, b) => b[1][0] - a[1][0]).forEach(([p, v]) => summary.push([p, v[0], v[1]]));
    const ws1 = XLSX.utils.aoa_to_sheet(summary);
    ws1["!cols"] = [{ wch: 26 }, { wch: 28 }, { wch: 10 }];
    XLSX.utils.book_append_sheet(wb, ws1, "Summary");

    const body = [["Date", "Day", "#", "Task", "Project", "Status", "Notes"]];
    let last = null, n = 0;
    list.forEach((r) => { n = r.date === last ? n + 1 : 1; last = r.date; body.push([r.date, weekday(r.date), n, r.task, r.project, LABEL[r.status] || r.status, r.notes]); });
    const ws2 = XLSX.utils.aoa_to_sheet(body);
    ws2["!cols"] = [{ wch: 12 }, { wch: 11 }, { wch: 4 }, { wch: 50 }, { wch: 18 }, { wch: 13 }, { wch: 45 }];
    ws2["!autofilter"] = { ref: "A1:G" + body.length };
    XLSX.utils.book_append_sheet(wb, ws2, "Tasks");

    const cl = checklistData();
    if (cl.routine.length && cl.dates.length) {
      const grid = [["Task", ...cl.dates.map((d) => d + " (" + parse(d).toLocaleDateString("en-GB", { weekday: "short" }) + ")"), "Done", "Logged"]];
      cl.routine.forEach((rt) => {
        let done = 0, logged = 0;
        const cells = cl.dates.map((d) => { const r = cl.cell(rt, d); if (!r) return "-"; logged++;
          if (r.status === "done") { done++; return "Yes"; } return r.status === "not_done" ? "No" : LABEL[r.status]; });
        grid.push([rt.id + ". " + rt.task, ...cells, done, logged]);
      });
      const ws3 = XLSX.utils.aoa_to_sheet(grid);
      ws3["!cols"] = [{ wch: 46 }, ...cl.dates.map(() => ({ wch: 17 })), { wch: 7 }, { wch: 8 }];
      XLSX.utils.book_append_sheet(wb, ws3, "Checklist");
    }

    XLSX.writeFile(wb, "Work-Report_" + (from === to ? from : from + "_to_" + to) + ".xlsx");
  }

  // One-page A4 PDF: header, summary, then one line per task with its status
  function downloadPdf() {
    if (!window.jspdf || !window.jspdf.jsPDF) { alert("The PDF library didn't load. Check your connection and reload."); return; }
    const list = filtered().slice().sort((a, b) => a.date.localeCompare(b.date));
    const from = $("from").value, to = $("to").value;
    const dates = [...new Set(list.map((r) => r.date))].sort();
    const c = (s) => list.filter((r) => r.status === s).length;
    const doc = new window.jspdf.jsPDF({ unit: "mm", format: "a4" });
    const W = 210, M = 16;
    const TEAL = [15, 110, 120], INK = [22, 33, 42], GREY = [93, 107, 118];
    const ST = { done: { t: [31, 122, 67], f: [227, 244, 233] }, not_done: { t: [180, 46, 46], f: [251, 229, 229] }, blocked: { t: [180, 46, 46], f: [251, 229, 229] },
      in_progress: { t: [154, 91, 0], f: [251, 239, 217] }, pending: { t: [75, 90, 102], f: [233, 237, 240] } };

    // header band
    doc.setFillColor(...TEAL); doc.rect(0, 0, W, 30, "F");
    doc.setTextColor(255, 255, 255); doc.setFont("helvetica", "bold"); doc.setFontSize(19);
    doc.text("Daily Work Report", M, 15);
    doc.setFont("helvetica", "normal"); doc.setFontSize(10);
    const period = !dates.length ? (from === to ? nice(from) : nice(from) + "  to  " + nice(to))
      : dates.length === 1 ? nice(dates[0]) : nice(from) + "  to  " + nice(to);
    doc.text(period, M, 23);
    doc.text("Generated " + new Date().toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }), W - M, 23, { align: "right" });

    // summary strip
    const rate = list.length ? Math.round((c("done") / list.length) * 100) + "%" : "-";
    const boxes = [["Total tasks", String(list.length)], ["Done", String(c("done"))], ["Not done", String(c("not_done") + c("blocked"))], ["Completion", rate]];
    const bw = (W - 2 * M - 3 * 4) / 4; let y = 38;
    boxes.forEach(([l, v], i) => {
      const x = M + i * (bw + 4);
      doc.setDrawColor(221, 227, 231); doc.setFillColor(247, 249, 250); doc.roundedRect(x, y, bw, 17, 2, 2, "FD");
      doc.setTextColor(...GREY); doc.setFontSize(8); doc.text(l.toUpperCase(), x + 4, y + 6);
      const col = i === 1 ? ST.done.t : i === 2 ? ST.not_done.t : i === 3 ? TEAL : INK;
      doc.setTextColor(...col); doc.setFont("helvetica", "bold"); doc.setFontSize(15); doc.text(v, x + 4, y + 14);
      doc.setFont("helvetica", "normal");
    });
    y += 25;

    const statusCell = (data, col) => {
      if (data.section === "body" && data.column.index === col) {
        const key = data.cell.raw && data.cell.raw.key;
        if (key && ST[key]) { data.cell.styles.textColor = ST[key].t; data.cell.styles.fillColor = ST[key].f; data.cell.styles.fontStyle = "bold"; }
        if (data.cell.raw && data.cell.raw.content != null) data.cell.text = [data.cell.raw.content];
      }
    };
    const common = { theme: "grid", margin: { left: M, right: M }, headStyles: { fillColor: INK, textColor: 255, fontSize: 9, fontStyle: "bold" },
      styles: { fontSize: 9.5, cellPadding: 2.6, textColor: INK, lineColor: [221, 227, 231], lineWidth: 0.2, valign: "middle", overflow: "linebreak" } };

    if (!list.length) {
      doc.setTextColor(...GREY); doc.setFontSize(11); doc.text("No tasks logged for this period.", M, y + 6);
    } else if (dates.length === 1) {
      // single day: # | Task | Status | Notes
      doc.setTextColor(...INK); doc.setFont("helvetica", "bold"); doc.setFontSize(12); doc.text("Tasks", M, y); y += 3;
      doc.autoTable({ ...common, startY: y,
        head: [["#", "Task", "Status", "Notes"]],
        body: list.map((r, i) => [String(i + 1), r.task, { content: LABEL[r.status] || r.status, key: r.status, styles: { halign: "center" } }, r.notes || ""]),
        columnStyles: { 0: { cellWidth: 9, halign: "center" }, 1: { cellWidth: 82 }, 2: { cellWidth: 26 }, 3: { cellWidth: "auto", textColor: GREY } },
        didParseCell: (d) => statusCell(d, 2) });
    } else {
      // several days: one line per task, status per day, plus done count
      const routine = DATA.routine || [];
      const tasks = routine.length ? routine.map((rt) => ({ label: rt.id + ". " + rt.task, match: (r) => r.rid === rt.id || r.task === rt.task })) : [];
      list.filter((r) => !routine.some((rt) => r.rid === rt.id || r.task === rt.task)).forEach((r) => {
        if (!tasks.some((t) => t.label === r.task)) tasks.push({ label: r.task, match: (x) => x.task === r.task && !x.rid });
      });
      const wide = dates.length <= 10;
      doc.setTextColor(...INK); doc.setFont("helvetica", "bold"); doc.setFontSize(12); doc.text("Tasks by day", M, y); y += 3;
      if (wide) {
        doc.autoTable({ ...common, startY: y,
          head: [["Task", ...dates.map((d) => parse(d).toLocaleDateString("en-GB", { weekday: "short", day: "numeric" })), "Done"]],
          body: tasks.map((t) => {
            let done = 0, logged = 0;
            const cells = dates.map((d) => { const r = list.find((x) => x.date === d && t.match(x)); if (!r) return { content: "-", styles: { halign: "center", textColor: GREY } };
              logged++; if (r.status === "done") done++;
              return { content: r.status === "done" ? "Yes" : r.status === "not_done" ? "No" : (LABEL[r.status] || r.status), key: r.status, styles: { halign: "center" } }; });
            return [t.label, ...cells, { content: done + "/" + logged, styles: { halign: "center", fontStyle: "bold" } }];
          }),
          styles: { ...common.styles, fontSize: dates.length > 7 ? 8 : 9 },
          columnStyles: { 0: { cellWidth: dates.length > 7 ? 58 : 70 } },
          didParseCell: (d) => { if (d.section === "body" && d.column.index > 0 && d.column.index <= dates.length) statusCell(d, d.column.index); } });
      } else {
        doc.autoTable({ ...common, startY: y,
          head: [["Task", "Done", "Not done", "Days logged", "Status"]],
          body: tasks.map((t) => {
            const rs = list.filter(t.match); const dn = rs.filter((r) => r.status === "done").length;
            const pct = rs.length ? Math.round((dn / rs.length) * 100) : 0;
            const key = pct >= 80 ? "done" : pct >= 50 ? "in_progress" : "not_done";
            return [t.label, String(dn), String(rs.length - dn), String(rs.length), { content: pct + "% done", key, styles: { halign: "center" } }];
          }),
          columnStyles: { 0: { cellWidth: 82 }, 1: { halign: "center" }, 2: { halign: "center" }, 3: { halign: "center" } },
          didParseCell: (d) => statusCell(d, 4) });
      }
      // notes, as many as fit on the page
      const notes = list.filter((r) => r.notes);
      let ny = doc.lastAutoTable.finalY + 9;
      if (notes.length && ny < 255) {
        doc.setTextColor(...INK); doc.setFont("helvetica", "bold"); doc.setFontSize(12); doc.text("Notes", M, ny); ny += 6;
        doc.setFont("helvetica", "normal"); doc.setFontSize(9);
        for (const r of notes) {
          const line = doc.splitTextToSize(short(r.date) + "  " + r.task + ": " + r.notes, W - 2 * M);
          if (ny + line.length * 4.5 > 272) { doc.setTextColor(...GREY); doc.text("More notes in the Excel report.", M, ny); break; }
          doc.setTextColor(...GREY); doc.text(line, M, ny); ny += line.length * 4.5 + 1;
        }
      }
    }

    // footer
    doc.setDrawColor(221, 227, 231); doc.line(M, 282, W - M, 282);
    doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(...GREY);
    doc.text("Live dashboard: " + location.href.split("?")[0].split("#")[0], M, 287);
    doc.text("Page 1 of 1", W - M, 287, { align: "right" });

    const name = !dates.length ? from : dates.length === 1 ? dates[0] : from + "_to_" + to;
    doc.save("Work-Report_" + name + ".pdf");
  }

  document.querySelectorAll(".chip").forEach((b) => b.addEventListener("click", () => setPreset(b.dataset.p)));
  $("pdf").addEventListener("click", downloadPdf);
  ["from", "to"].forEach((id) => $(id).addEventListener("change", () => { document.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", "false")); update(); }));
  ["status", "project"].forEach((id) => $(id).addEventListener("change", update));
  $("q").addEventListener("input", update);
  $("xlsx").addEventListener("click", downloadExcel);
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", update);

  fetch("data/tasks.json?v=" + Date.now(), { cache: "no-store" })
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then((data) => {
      DATA = data;
      if (data.title) { $("title").textContent = data.title; document.title = data.title; }
      if (data.updated) $("updated").textContent = "Last updated " + new Date(data.updated).toLocaleString("en-GB");
      rows = (data.days || []).flatMap((d) => (d.tasks || []).map((t) => ({ date: d.date, rid: t.rid, task: t.task || "", project: t.project || "", status: t.status || "pending", notes: t.notes || "" })));
      const projects = [...new Set(rows.map((r) => r.project).filter(Boolean))].sort();
      projects.forEach((p) => { const o = el("option", null, p); o.value = p; $("project").append(o); });
      setPreset("week");
    })
    .catch(() => { $("days").replaceChildren(el("div", "state", "Couldn't load the task data. Reload the page to try again.")); });
})();
</script>
</body>
